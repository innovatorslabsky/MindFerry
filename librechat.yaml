# For the full set of options, see librechat.example.yaml and:
# https://www.librechat.ai/docs/configuration/librechat_yaml

# Configuration version (required)
version: 1.3.16

# MindFerry: archives conversations and serves them back over MCP so tools
# like Claude Code or Claude.ai's web connector can search and read past
# context. See docs/mindferry.md for the connection steps.
contextHub:
  enabled: true
  mcp:
    enabled: true
    searchLimit: 20
    snippetLength: 400
    allowNotes: true

# FreeLLMAPI: a self-hosted proxy that aggregates free tiers from 20+ LLM
# providers behind one OpenAI-compatible endpoint. See docs/freellmapi.md.
endpoints:
  custom:
    - name: 'FreeLLMAPI'
      apiKey: '${FREELLMAPI_KEY}'
      baseURL: 'http://freellmapi:3001/v1'
      models:
        default:
          - 'gemini-2.5-flash'
          - 'llama-4-scout-17b-16e-instruct'
          - 'qwen3-235b-a22b'
          - 'deepseek-v4-0324'
          - 'mistral-small-latest'
        fetch: true
      titleConvo: true
      titleModel: 'gemini-2.5-flash'
      modelDisplayLabel: 'FreeLLMAPI'

# SearXNG: a self-hosted, keyless metasearch engine used as MindFerry's Web
# Search provider — no third-party search API key required. See docs/searxng.md.
webSearch:
  searchProvider: searxng
  searxngInstanceUrl: 'http://searxng:8080'
  scraperProvider: keenable # keyless page-content fetcher; pairs with searxng for a fully keyless stack
  rerankerType: none # every reranker requires a key; 'none' skips reranking
  # Self-hosted destinations are blocked by MindFerry's SSRF guard unless
  # explicitly allowlisted here, host:port only.
  allowedAddresses:
    - 'searxng:8080'
  searxngSearchOptions:
    engines:
      - google
      - bing
      - startpage
      - qwant
